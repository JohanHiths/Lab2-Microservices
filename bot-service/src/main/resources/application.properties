spring.application.name=bot-service

server.port=8086
grpc.server.port=9098

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=bot_service_group_v2

openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.model=openai/gpt-4o-mini



spring.kafka.consumer.auto-offset-reset=earliest



spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


logging.level.org.springframework.kafka=DEBUG
logging.level.org.springframework.kafka.listener=DEBUG
logging.level.org.apache.kafka.clients.consumer=DEBUG
logging.level.org.apache.kafka.clients.NetworkClient=INFO

logging.level.org.apache.kafka=INFO
logging.level.org.springframework.security=DEBUG

jwt.secret=${JWT_SECRET_FILE}

