syntax = "proto3";

option java_package = "com.example.chat.user";
option java_multiple_files = true;

service UserService {
  rpc CreateUser (CreateUserRequest) returns (UserResponse);
  rpc GetUserProfile (UserRequest) returns (UserResponse);

  rpc GetUserByUsername (UsernameRequest) returns (UserResponse);

  rpc UpdateUser (UpdateUserRequest) returns (UserResponse);
  rpc DeleteUser (UserRequest) returns (DeleteUserResponse);
  rpc ListUsers (Empty) returns (UserList);
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
  string display_name = 3;
  string email = 4;

}

message UserRequest {
  int64 user_id = 1;
}


message UsernameRequest {
  string username = 1;
}

message UpdateUserRequest{

}

message UserResponse {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  string email = 4;
  string password_hash = 5;

}

message DeleteUserResponse {
  bool success = 1;
}

message Empty {}
message UserList {
  repeated UserResponse users = 1;
}